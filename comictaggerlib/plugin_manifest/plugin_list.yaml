- plugin_id: gcd
  name: Grand Comics Database
  type: Talkers
  desc: A talker to use the sqlite file of comic information from GCD
  manifest: https://api.github.com/repos/comictagger/gcd_talker/manifest.yaml

- plugin_id: metron
  name: Metron
  type: Talkers
  desc: A talker to use the comic information from Metron.cloud
  manifest: https://api.github.com/repos/comictagger/metron_talker/manifest.yaml

- plugin_id: metroninfo
  name: MetronInfo XML
  type: Tags
  desc: Adds support for the Metron XML tagging file
